[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goav"
version = "0.1.0"
description = "Gradient-Optimal Active Verification experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "PyYAML>=6"]

[project.optional-dependencies]
model = ["torch>=2.2", "transformers>=4.45", "peft>=0.13", "bitsandbytes>=0.43", "datasets>=3"]
test = ["pytest>=8"]

[project.scripts]
goav-run = "goav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
